name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

defaults:
  run:
    working-directory: ./excalibur

jobs:
  test:
    name: Test
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: excalibur

      - uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1.12.0
        with:
          node-version: "22"
          cache: true

      - name: Setup Java
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0

      - name: Install Conan
        run: |
          python3 -m pip install --user "conan>=2,<3"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          conan --version

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: "microsoft/vcpkg"
          ref: "2026.04.27"
          fetch-depth: 0
          path: "vcpkg"

      - name: Bootstrap vcpkg tool
        working-directory: ./vcpkg
        run: |
          ./bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=$(pwd)" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/vcpkg" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: vp install

      - name: Ready
        run: vp run -w ready

      - name: Upload to SCA Tool
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: >
          vpx @scatool/cli@0.1.0-alpha.0 revisions create-sbom main
          --codebase .
          --ignore "**/node_modules/**,test/repositories/**,**/__fixtures__/**"
        env:
          SCATOOL_TOKEN: ${{ secrets.SCATOOL_TOKEN }}
          SCATOOL_PROJECT_ID: ${{ secrets.SCATOOL_PROJECT_ID }}
