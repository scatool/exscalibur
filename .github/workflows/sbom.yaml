name: SBOM

on:
  push:
    branches: [main, ci/sbom]
    tags: ["v*"]

permissions: read-all

jobs:
  upload-sbom:
    name: Upload SBOM
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: voidzero-dev/setup-vp@24d870228786dc83ae73482406bdd1e7befaec14 # v1.21.0
        with:
          node-version: "22"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Build packages
        run: vp run -r build

      - name: Generate SBOM result
        run: >
          node packages/analyzer-cli/dist/cli.mjs
          --ignore "**/node_modules/**,test/repositories/**,**/__fixtures__/**"
          .
          exscalibur-result.json

      - name: Upload to SCA Tool
        run: >
          vpx @scatool/cli@0.1.0-alpha.0 revisions create-sbom "${{ github.ref_name }}"
          --file exscalibur-result.json
        env:
          SCATOOL_TOKEN: ${{ secrets.SCATOOL_TOKEN }}
          SCATOOL_PROJECT_ID: ${{ secrets.SCATOOL_PROJECT_ID }}
