name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  integration-tests:
    name: Integration Tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version: "22"
          cache: true

      - name: Setup Java
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: "temurin"
          java-version: |
            11
            17

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ">=1.25"

      - name: Setup uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1

      - name: Install Conan
        run: |
          python3 -m pip install --user "conan>=2,<3"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          conan --version

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: "microsoft/vcpkg"
          ref: "2026.04.27"
          fetch-depth: 0
          path: "vcpkg"

      - name: Bootstrap vcpkg tool
        working-directory: ./vcpkg
        run: |
          ./bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=$(pwd)" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/vcpkg" >> "$GITHUB_PATH"

      - name: Cache test repositories
        id: cache-repos
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test/repositories
          key: test-repositories-${{ hashFiles('test/repositories.json') }}
          restore-keys: |
            test-repositories-

      - name: Download test repositories
        if: steps.cache-repos.outputs.cache-hit != 'true'
        run: vp exec tsx test/scripts/download-repositories.ts

      - name: Install dependencies
        run: vp install

      - name: Build packages
        run: vp run -r build

      - name: Create system.json for Java paths
        run: |
          cat > test/system.json << EOF
          {
            "java": {
              "11": "${{ env.JAVA_HOME_11_X64 }}",
              "17": "${{ env.JAVA_HOME_17_X64 }}"
            }
          }
          EOF

      - name: Run integration tests
        run: vp test run test/integration.test.ts
