name: Integration Tests

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]

jobs:
  integration-tests:
    name: Integration Tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            11
            17

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.25'

      - name: Cache test repositories
        id: cache-repos
        uses: actions/cache@v4
        with:
          path: test/repositories
          key: test-repositories-${{ hashFiles('test/repositories.json') }}
          restore-keys: |
            test-repositories-

      - name: Download test repositories
        if: steps.cache-repos.outputs.cache-hit != 'true'
        run: bun run test/scripts/download-repositories.ts

      - name: Install dependencies
        run: bun install

      - name: Create system.json for Java paths
        run: |
          cat > test/system.json << EOF
          {
            "java": {
              "11": "${{ env.JAVA_HOME_11_X64 }}",
              "17": "${{ env.JAVA_HOME_17_X64 }}"
            }
          }
          EOF

      - name: Run integration tests
        run: bun test test/integration.test.ts
