name: Integration Tests

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]

jobs:
  integration-tests:
    name: Integration Tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: |
            11
            17

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '>=1.25'

      - name: Setup uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Cache test repositories
        id: cache-repos
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: test/repositories
          key: test-repositories-${{ hashFiles('test/repositories.json') }}
          restore-keys: |
            test-repositories-

      - name: Download test repositories
        if: steps.cache-repos.outputs.cache-hit != 'true'
        run: bun run test/scripts/download-repositories.ts

      - name: Install dependencies
        run: bun install

      - name: Create system.json for Java paths
        run: |
          cat > test/system.json << EOF
          {
            "java": {
              "11": "${{ env.JAVA_HOME_11_X64 }}",
              "17": "${{ env.JAVA_HOME_17_X64 }}"
            }
          }
          EOF

      - name: Run integration tests
        run: bun test test/integration.test.ts
