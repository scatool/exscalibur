name: Integration Tests

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]

jobs:
  integration-tests:
    name: Integration Tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bun via npm
        run: npm install -g bun@1.3.1

      - name: Cache test repositories
        id: cache-repos
        uses: actions/cache@v4
        with:
          path: test/repositories
          key: test-repositories-${{ hashFiles('test/repositories.txt') }}
          restore-keys: |
            test-repositories-

      - name: Download test repositories
        if: steps.cache-repos.outputs.cache-hit != 'true'
        run: bun run test/scripts/download-repositories.ts

      - name: Install dependencies
        run: bun install

      - name: Run integration tests
        run: bun test test/integration.test.ts
