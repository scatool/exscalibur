name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  integration-tests:
    name: Integration Tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "22"
          cache: true

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          java-version: |
            11
            17

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ">=1.25"

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"

      - name: Install Conan
        run: |
          python3 -m pip install --user "conan>=2,<3"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          conan --version

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "microsoft/vcpkg"
          ref: "2026.04.27"
          fetch-depth: 0
          path: "vcpkg"

      - name: Bootstrap vcpkg tool
        working-directory: ./vcpkg
        run: |
          ./bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=$(pwd)" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/vcpkg" >> "$GITHUB_PATH"

      - name: Cache test repositories
        id: cache-repos
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test/repositories
          key: test-repositories-${{ hashFiles('test/repositories.json') }}
          restore-keys: |
            test-repositories-

      - name: Download test repositories
        if: steps.cache-repos.outputs.cache-hit != 'true'
        run: vp exec tsx test/scripts/download-repositories.ts

      - name: Install dependencies
        run: vp install

      - name: Build packages
        run: vp run -r build

      - name: Create system.json for Java paths
        run: |
          cat > test/system.json << EOF
          {
            "java": {
              "11": "${{ env.JAVA_HOME_11_X64 }}",
              "17": "${{ env.JAVA_HOME_17_X64 }}"
            }
          }
          EOF

      - name: Run integration tests
        run: vp test run test/integration.test.ts
