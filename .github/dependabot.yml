version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "@types/node"
        versions:
          - ">=25.0.0"
      # Vite+ pins its core (aliased as `vite`) and vitest to exact versions that
      # don't share its version number. Update these together with `vp migrate`.
      - dependency-name: "vite-plus"
      - dependency-name: "@voidzero-dev/vite-plus-core"
      - dependency-name: "vitest"
