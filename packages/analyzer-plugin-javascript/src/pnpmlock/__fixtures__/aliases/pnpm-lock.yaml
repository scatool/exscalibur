  'string-width@5.1.2':
    resolution: { integrity: sha512-test2 }
    engines: { node: '>=12' }

  'strip-ansi@6.0.1':
    resolution: { integrity: sha512-test3 }
    engines: { node: '>=8' }

  'strip-ansi@7.1.0':
    resolution: { integrity: sha512-test4 }
    engines: { node: '>=12' }

  'wrap-ansi@7.0.0':
    resolution: { integrity: sha512-test5 }
    engines: { node: '>=10' }

  'wrap-ansi@8.1.0':
    resolution: { integrity: sha512-test6 }
    engines: { node: '>=12' }

  '@docusaurus/react-loadable@6.0.0':
