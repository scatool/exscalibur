    dependencies:
      react: 18.2.0

  'react@18.2.0': {}

  'test-package@1.0.0':
    dependencies:
      string-width: 5.1.2
      string-width-cjs: string-width@4.2.3
      strip-ansi: 7.1.0
      strip-ansi-cjs: strip-ansi@6.0.1
      wrap-ansi: 8.1.0
      wrap-ansi-cjs: wrap-ansi@7.0.0
      react-loadable: '@docusaurus/react-loadable@6.0.0(react@18.2.0)'
