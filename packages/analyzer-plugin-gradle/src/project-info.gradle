// Gradle init script to extract project metadata (group, name, version, build file)
gradle.projectsEvaluated {
    def projectInfo = [:]

    allprojects { project ->
        projectInfo[project.path] = [
            name: project.name,
            group: project.group.toString(),
            version: project.version.toString(),
            buildFile: project.buildFile.absolutePath.replace(File.separatorChar, '/' as char)
        ]
    }

    println "===PROJECT_INFO_START==="
    println groovy.json.JsonOutput.toJson(projectInfo)
    println "===PROJECT_INFO_END==="
}
