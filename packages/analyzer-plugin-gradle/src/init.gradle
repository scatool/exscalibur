// Gradle init script using GitHub dependency graph plugin
// Based on: https://github.com/gradle/github-dependency-graph-gradle-plugin

initscript {
    repositories {
        gradlePluginPortal()
    }
    dependencies {
        classpath "org.gradle:github-dependency-graph-gradle-plugin:1.4.0"
    }
}

apply plugin: org.gradle.dependencygraph.simple.SimpleDependencyGraphPlugin
