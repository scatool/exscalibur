[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sample-2"
version = "0.0.1"
requires-python = ">=3.9"
dependencies = []

[tool.hatch.envs.default]
locked = true
locker = "uv"
installer = "uv"
dependencies = ["numpy", "python-dateutil"]

[tool.hatch.envs.dev]
locked = true
locker = "uv"
installer = "uv"
dependencies = ["torch", "torchvision"]
