[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "optional-and-groups"
version = "0.0.1"
requires-python = ">=3.9"
dependencies = ["six"]

[project.optional-dependencies]
test = ["idna"]

[dependency-groups]
docs = ["certifi"]

[tool.hatch.envs.default]
locked = true
locker = "uv"
installer = "uv"
features = ["test"]
dependency-groups = ["docs"]
