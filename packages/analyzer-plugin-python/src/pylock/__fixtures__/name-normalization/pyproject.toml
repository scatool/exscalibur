[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my.project"
version = "0.0.1"
requires-python = ">=3.9"
# "zope.interface" is an unnormalized name, the lockfile name entry is zope-interface (normalized)
dependencies = ["six", "zope.interface"]

[tool.hatch.envs.default]
locked = true
locker = "uv"
installer = "uv"
