apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  labels:
    app: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      initContainers:
        - name: init-config
          image: busybox:1.36
          command: ['sh', '-c', 'echo "Initializing..."']
      containers:
        - name: app
          image: ghcr.io/myorg/myapp:v1.2.3
          ports:
            - containerPort: 8080
        - name: sidecar
          image: gcr.io/myproject/sidecar:latest
          ports:
            - containerPort: 9090
---
apiVersion: v1
kind: Pod
metadata:
  name: standalone-pod
spec:
  containers:
    - name: main
      image: ubuntu:22.04
      command: ['sleep', '3600']
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-job
spec:
  schedule: '0 2 * * *'
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: backup
              image: alpine:3.18
              command: ['sh', '-c', 'echo "Running backup"']
          restartPolicy: OnFailure
