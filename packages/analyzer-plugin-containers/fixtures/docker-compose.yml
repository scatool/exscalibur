version: '3.8'

services:
  web:
    image: nginx:1.25-alpine
    ports:
      - '80:80'
    volumes:
      - ./html:/usr/share/nginx/html

  app:
    image: node:20-alpine
    command: npm start
    working_dir: /app
    volumes:
      - ./app:/app

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: myapp

  cache:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  monitoring:
    image: prom/prometheus:v2.45.0
    ports:
      - '9090:9090'
